<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PaRuX — sign in</title>
<!--
  Reachable without credentials, so it is deliberately the smallest page PaRuX serves: a passphrase
  box and nothing else. No CDN, no font host, no analytics - a product whose whole claim is that it
  runs on your machine cannot have a sign-in page that phones out to render itself.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #F5F6F8; --panel: #FFFFFF; --ink: #19222B; --muted: #495967;
    --line: #B9C4CF; --accent: #344452; --accent-ink: #FFFFFF; --warn: #9D482B;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #07090C; --panel: #121820; --ink: #F2F4F7; --muted: #A7B0BA;
            --line: #33404C; --accent: #B7C0C9; --accent-ink: #07090C; --warn: #E2AD54; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--ink); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: min(24rem, calc(100vw - 2rem)); background: var(--panel); border: 1px solid var(--line);
          border-radius: .9rem; padding: 1.6rem; }
  h1 { margin: 0 0 .15rem; display: flex; align-items: center; gap: .7rem;
       font-size: 1.35rem; letter-spacing: .01em; }
  .brandmark { width: 2.5rem; height: 2.5rem; flex: none; display: block; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 1.3rem; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .35rem; }
  input { width: 100%; padding: .6rem .7rem; font: inherit; color: inherit; background: var(--bg);
          border: 1px solid var(--line); border-radius: .5rem; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { width: 100%; margin-top: .9rem; padding: .65rem 1rem; font: inherit; font-weight: 600;
           border-radius: .5rem; border: 1px solid transparent; background: var(--accent);
           color: var(--accent-ink); cursor: pointer; }
  button[disabled] { opacity: .55; cursor: default; }
  #error { color: var(--warn); font-size: .85rem; margin-top: .8rem; min-height: 1.2rem; }
  .foot { margin-top: 1.2rem; padding-top: .9rem; border-top: 1px solid var(--line);
          color: var(--muted); font-size: .75rem; }
</style>
</head>
<body>
<main class="card">
  <h1>
    <svg class="brandmark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <rect x="1.5" y="1.5" width="45" height="45" rx="10" fill="#111820" stroke="#68717A" stroke-width=".75"/>
      <ellipse cx="24" cy="24" rx="19.5" ry="10.7" transform="rotate(-36 24 24)" fill="none" stroke="#B89B6A" stroke-width="1.2"/>
      <path d="M29.8 24.75h4.5l2.8 4.1 3.75-4.1h3.75l-5.1 7.7 5.25 7.7h-4.5l-3.2-4.1-3.75 4.3h-4.9l6.2-7.9z" fill="#B89B6A"/>
      <path d="M9.4 14.4h19.3l4.9 4.3.9 2.2-5.1 5.5H21l-6.2 9.8-5.6 5.4 4.3-18.4h13.3l2.4-2.4-2.2-1.6H11.3z" fill="#D3DAE0"/>
    </svg>
    PaRuX
  </h1>
  <div class="sub">Your local-first workspace, on this machine.</div>
  <form id="form">
    <label for="passphrase">Passphrase</label>
    <input id="passphrase" type="password" autocomplete="current-password" autofocus required>
    <button id="submit" type="submit">Sign in</button>
  </form>
  <div id="error" role="alert"></div>
  <div class="foot">
    Inference runs on the PC this page is served from. Nothing is sent to a cloud provider.
  </div>
</main>
<script>
(function () {
  var form = document.getElementById('form');
  var field = document.getElementById('passphrase');
  var submit = document.getElementById('submit');
  var error = document.getElementById('error');

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    error.textContent = '';
    submit.disabled = true;
    submit.textContent = 'Checking…';

    fetch('/api/v1/web/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ passphrase: field.value })
    }).then(function (response) {
      return response.json().then(function (body) { return { ok: response.ok, body: body }; });
    }).then(function (result) {
      if (!result.ok) throw new Error(result.body && result.body.error ? result.body.error : 'Sign-in failed.');
      // The CSRF token lives only in this tab's memory for the lifetime of the page. sessionStorage
      // rather than localStorage so closing the tab discards it.
      try { sessionStorage.setItem('parux_csrf', result.body.csrfToken); } catch (e) {}
      location.replace('/app');
    }).catch(function (failure) {
      error.textContent = failure.message;
      submit.disabled = false;
      submit.textContent = 'Sign in';
      field.select();
    });
  });
})();
</script>
</body>
</html>
